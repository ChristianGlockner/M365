services:
  postgres:
    image: postgres:16-alpine
    container_name: m365-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: m365
      POSTGRES_PASSWORD: m365
      POSTGRES_DB: m365
    volumes:
      - m365_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m365 -d m365"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: enable when assessment jobs need a queue (BullMQ).
  # redis:
  #   image: redis:7-alpine
  #   container_name: m365-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
